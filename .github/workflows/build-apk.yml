name: Build Kotlin APK (xumi-media-kt)

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.5.0 --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK to GitHub Release (quota-safe)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "须弥Media Kotlin 最新构建" \
            --notes "须弥Media Kotlin 客户端（AndroidLiquidGlass 液态玻璃导航栏） - 最新构建" \
            --prerelease
          echo "=== Release uploaded ==="

      - name: Clean old artifacts (best-effort)
        shell: bash
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | reverse | .[3:][] | .id' 2>/dev/null || true)
          if [ -n "$ids" ]; then
            for id in $ids; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 \
                && echo "deleted $id" || echo "delete $id failed"
            done
          else
            echo "no old artifacts to delete"
          fi